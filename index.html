<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ibrahim Khan — Final Year AI & Data Science Student Portfolio</title>
    <meta name="description" content="Portfolio of Ibrahim Khan, Final Year AI & Data Science Student at Datta Meghe College of Engineering. Open to Data Science & ML internships." />
    <meta property="og:title" content="Ibrahim Khan — AI & Data Science Portfolio" />
    <meta property="og:description" content="Final Year Artificial Intelligence & Data Science student exploring data, building practical skills, and learning through real-world projects." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
    <style>
      #nl-badge-frame,
      #nl-hud-frame,
      iframe[id*="nl-"],
      iframe[title*="Netlify"],
      iframe[title*="Powered by Netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        clip: rect(0, 0, 0, 0) !important;
        clip-path: inset(50%) !important;
        width: 0 !important;
        height: 0 !important;
        position: fixed !important;
        left: -9999px !important;
        bottom: -9999px !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      try {
        localStorage.setItem('nl-hud:public:v1', 'hidden');
        localStorage.setItem('nl-hud:owner-private:v1', 'hidden');
      } catch (e) {}
      (function() {
        const killNetlify = function() {
          const els = document.querySelectorAll('#nl-badge-frame, #nl-hud-frame, iframe[title*="Netlify"], iframe[title*="Powered by Netlify"], script[data-nf-variant]');
          els.forEach(function(el) { el.remove(); });
        };
        killNetlify();
        if (window.MutationObserver) {
          new MutationObserver(killNetlify).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </head>
  <body class="bg-[#FAF7F0] text-[#2B2B28] antialiased selection:bg-[#6EE7B7]/40 selection:text-[#2F4739]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
